<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coming Soon｜版本三</title>
  <style>
    :root {
      --bg: #f5f7fa;
      --ink: #1d2733;
      --muted: #5d6b7a;
      --accent: #2557d6;
      --accent-soft: #e8eefc;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #11161d;
        --ink: #e8edf3;
        --muted: #9aa8b8;
        --accent: #7ba3ff;
        --accent-soft: #212c44;
      }
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--bg);
      color: var(--ink);
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
      text-align: center;
      line-height: 1.7;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(2.4rem, 9vw, 4.5rem);
      letter-spacing: 0.02em;
    }

    p {
      margin: 0 0 28px;
      color: var(--muted);
    }

    a {
      display: inline-block;
      padding: 10px 22px;
      color: var(--accent);
      background: var(--accent-soft);
      border-radius: 999px;
      font-weight: 600;
      text-decoration: none;
    }

    a:hover,
    a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Coming Soon</h1>
    <p>版本三還在製作中，請稍後再來看看。</p>
    <a href="index.html">返回首頁</a>
  </main>
</body>
</html>
