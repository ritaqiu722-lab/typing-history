<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>英打遊戲｜版本三</title>
  <style>
    :root {
      --bg: #f5f7fa;
      --card: #ffffff;
      --ink: #1d2733;
      --muted: #5d6b7a;
      --line: #d9e0e8;
      --accent: #2557d6;
      --accent-ink: #ffffff;
      --accent-soft: #e8eefc;
      --key: #eef1f5;
      --key-dim: #f5f7fa;
      --bad: #d6352f;
      --bad-soft: #fde8e7;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #11161d;
        --card: #1a212b;
        --ink: #e8edf3;
        --muted: #9aa8b8;
        --line: #2b3542;
        --accent: #7ba3ff;
        --accent-ink: #0d1626;
        --accent-soft: #212c44;
        --key: #232c38;
        --key-dim: #1a212b;
        --bad: #ff7b74;
        --bad-soft: #3a1f1e;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
      line-height: 1.7;
    }

    .wrap {
      max-width: 860px;
      margin: 0 auto;
      padding: 40px 20px 56px;
    }

    .back {
      display: inline-block;
      margin-bottom: 20px;
      color: var(--accent);
      font-weight: 600;
      text-decoration: none;
    }
    .back:hover { text-decoration: underline; }
    .back:focus-visible,
    button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 2rem;
      letter-spacing: 0.02em;
    }
    .lead {
      margin: 0 0 28px;
      color: var(--muted);
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 24px;
    }

    /* 題目與分數 */
    .stage {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
    }

    .prompt-label {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .target {
      font-size: clamp(4rem, 16vw, 7rem);
      font-weight: 700;
      line-height: 1.1;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      color: var(--accent);
      min-height: 1.1em;
    }
    .target.idle { color: var(--muted); font-size: 1.4rem; font-family: inherit; font-weight: 600; padding: 24px 0; }

    .score-box {
      text-align: right;
    }
    .score-box .num {
      font-size: clamp(2.4rem, 8vw, 3.6rem);
      font-weight: 700;
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
    }
    .score-box .num.pop { animation: pop 0.18s ease-out; }
    @keyframes pop {
      from { transform: scale(1.25); }
      to { transform: scale(1); }
    }

    .status {
      min-height: 1.7em;
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 0.95rem;
    }
    .status.bad { color: var(--bad); }

    /* 鍵盤 */
    .keyboard {
      --k: clamp(26px, 7vw, 58px);
      --gap: clamp(3px, 0.8vw, 7px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--gap);
      padding: clamp(10px, 2.5vw, 20px);
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 10px;
      user-select: none;
    }
    .krow { display: flex; gap: var(--gap); }
    .krow.r2 { margin-left: calc(var(--k) * 0.5); }
    .krow.r3 { margin-left: calc(var(--k) * 1.5); }

    .key {
      width: var(--k);
      height: var(--k);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(0.8rem, 2.6vw, 1.25rem);
      font-weight: 600;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      color: var(--muted);
      background: var(--key-dim);
      border: 1px solid var(--line);
      border-bottom-width: 3px;
      border-radius: 8px;
      opacity: 0.6;
      transition: transform 0.06s, background 0.1s, border-color 0.1s;
    }
    .key.play {
      opacity: 1;
      color: var(--ink);
      background: var(--key);
      border-color: var(--accent);
    }
    .key.lit {
      color: var(--accent-ink);
      background: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 0 0 4px var(--accent-soft), 0 0 18px var(--accent);
    }
    .key.down { transform: translateY(2px); border-bottom-width: 1px; }
    .key.bad {
      color: var(--bad);
      background: var(--bad-soft);
      border-color: var(--bad);
      opacity: 1;
    }
    .space {
      width: calc(var(--k) * 6);
      height: calc(var(--k) * 0.7);
      margin-top: 2px;
      background: var(--key-dim);
      border: 1px solid var(--line);
      border-bottom-width: 3px;
      border-radius: 8px;
      opacity: 0.6;
    }

    /* 按鈕 */
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 24px;
    }
    button {
      padding: 10px 22px;
      font: inherit;
      font-weight: 600;
      color: var(--accent);
      background: var(--accent-soft);
      border: 1px solid transparent;
      border-radius: 999px;
      cursor: pointer;
    }
    button.primary { color: var(--accent-ink); background: var(--accent); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    button:not(:disabled):hover { border-color: var(--accent); }

    .hint {
      margin: 20px 0 0;
      color: var(--muted);
      font-size: 0.9rem;
    }

    footer {
      margin-top: 32px;
      color: var(--muted);
      font-size: 0.85rem;
    }

    @media (prefers-reduced-motion: reduce) {
      .key, .score-box .num.pop { transition: none; animation: none; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <a class="back" href="../index.html">返回入口首頁</a>

    <h1>英打遊戲　版本三</h1>
    <p class="lead">這一版開始練習手指位置：只練習 A、S、D、F 四個鍵。</p>

    <section class="panel" aria-label="遊戲區">
      <div class="stage">
        <div>
          <p class="prompt-label">請按這個字母</p>
          <div class="target idle" id="target" aria-live="polite">按「開始」</div>
        </div>
        <div class="score-box">
          <p class="prompt-label">分數</p>
          <div class="num" id="score">0</div>
        </div>
      </div>

      <p class="status" id="status" role="status" aria-live="polite">按下「開始」後，用實體鍵盤按亮起的按鍵。</p>

      <div class="keyboard" id="keyboard" aria-label="英文鍵盤"></div>

      <div class="controls">
        <button type="button" class="primary" id="btn-start">開始</button>
        <button type="button" id="btn-restart" disabled>重新開始</button>
        <button type="button" id="btn-stop" disabled>停止練習</button>
      </div>

      <p class="hint">請使用實體鍵盤，並先切換成英文輸入法。長按按鍵只會算一次，放開後才能再按。</p>
    </section>

    <footer>數位科技概論 課程作品</footer>
  </main>

  <script>
    (function () {
      var PRACTICE = ['A', 'S', 'D', 'F'];
      var ROWS = ['QWERTYUIOP', 'ASDFGHJKL', 'ZXCVBNM'];

      var keyboardEl = document.getElementById('keyboard');
      var targetEl = document.getElementById('target');
      var scoreEl = document.getElementById('score');
      var statusEl = document.getElementById('status');
      var btnStart = document.getElementById('btn-start');
      var btnRestart = document.getElementById('btn-restart');
      var btnStop = document.getElementById('btn-stop');

      var keyEls = {};          // 字母 -> 鍵盤按鍵元素
      var held = new Set();     // 目前按住、尚未放開的實體按鍵（用來擋長按重複計分）
      var running = false;
      var score = 0;
      var target = null;
      var badTimers = {};

      /* 用網頁樣式畫出鍵盤，不使用外部圖片 */
      ROWS.forEach(function (letters, i) {
        var row = document.createElement('div');
        row.className = 'krow r' + (i + 1);
        letters.split('').forEach(function (ch) {
          var k = document.createElement('div');
          k.className = 'key' + (PRACTICE.indexOf(ch) !== -1 ? ' play' : '');
          k.textContent = ch;
          keyEls[ch] = k;
          row.appendChild(k);
        });
        keyboardEl.appendChild(row);
      });
      var space = document.createElement('div');
      space.className = 'space';
      keyboardEl.appendChild(space);

      function setStatus(text, isBad) {
        statusEl.textContent = text;
        statusEl.className = 'status' + (isBad ? ' bad' : '');
      }

      function showScore(animate) {
        scoreEl.textContent = score;
        if (animate) {
          scoreEl.classList.remove('pop');
          void scoreEl.offsetWidth;
          scoreEl.classList.add('pop');
        }
      }

      function clearLit() {
        PRACTICE.forEach(function (ch) { keyEls[ch].classList.remove('lit'); });
      }

      function nextTarget() {
        var pool = PRACTICE.filter(function (ch) { return ch !== target; });
        target = pool[Math.floor(Math.random() * pool.length)];
        clearLit();
        keyEls[target].classList.add('lit');
        targetEl.textContent = target;
        targetEl.className = 'target';
      }

      function begin() {
        running = true;
        score = 0;
        target = null;
        showScore(false);
        nextTarget();
        setStatus('練習中：按下亮起的按鍵。');
        btnStart.disabled = true;
        btnRestart.disabled = false;
        btnStop.disabled = false;
        document.activeElement && document.activeElement.blur();
      }

      function stop() {
        running = false;
        target = null;
        clearLit();
        targetEl.textContent = '已停止';
        targetEl.className = 'target idle';
        setStatus('已停止練習，最終分數：' + score + ' 分。按「開始」可再練習一次。');
        btnStart.disabled = false;
        btnStop.disabled = true;
        document.activeElement && document.activeElement.blur();
      }

      btnStart.addEventListener('click', begin);
      btnRestart.addEventListener('click', begin);
      btnStop.addEventListener('click', stop);

      function flashBad(letter) {
        var el = keyEls[letter];
        el.classList.add('bad');
        clearTimeout(badTimers[letter]);
        badTimers[letter] = setTimeout(function () { el.classList.remove('bad'); }, 300);
      }

      /* 用 e.code 判斷實體按鍵，不受輸入法影響 */
      function letterFromEvent(e) {
        var m = /^Key([A-Z])$/.exec(e.code || '');
        return m ? m[1] : null;
      }

      window.addEventListener('keydown', function (e) {
        if (e.ctrlKey || e.metaKey || e.altKey) return;
        var letter = letterFromEvent(e);
        if (!letter) return;

        if (running) e.preventDefault();

        // 長按：瀏覽器會連續送出 keydown，這裡一律忽略，直到放開為止
        if (e.repeat || held.has(e.code)) return;
        held.add(e.code);
        keyEls[letter].classList.add('down');

        if (!running) return;

        if (letter === target) {
          score += 1;
          showScore(true);
          setStatus('答對了！');
          nextTarget();
        } else {
          flashBad(letter);
          setStatus('按錯了，請按 ' + target + '。', true);
        }
      });

      window.addEventListener('keyup', function (e) {
        var letter = letterFromEvent(e);
        if (!letter) return;
        held.delete(e.code);
        keyEls[letter].classList.remove('down');
      });

      // 視窗失焦時可能收不到 keyup，直接清空以免卡住
      window.addEventListener('blur', function () {
        held.clear();
        Object.keys(keyEls).forEach(function (ch) { keyEls[ch].classList.remove('down'); });
      });
    })();
  </script>
</body>
</html>
