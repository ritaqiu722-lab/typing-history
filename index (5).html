<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>英打遊戲開發歷程</title>
  <style>
    :root {
      --bg: #f5f7fa;
      --card: #ffffff;
      --ink: #1d2733;
      --muted: #5d6b7a;
      --line: #d9e0e8;
      --accent: #2557d6;
      --accent-soft: #e8eefc;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #11161d;
        --card: #1a212b;
        --ink: #e8edf3;
        --muted: #9aa8b8;
        --line: #2b3542;
        --accent: #7ba3ff;
        --accent-soft: #212c44;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
      line-height: 1.7;
    }

    .wrap {
      max-width: 1000px;
      margin: 0 auto;
      padding: 56px 20px 64px;
    }

    header { margin-bottom: 40px; }

    h1 {
      margin: 0 0 8px;
      font-size: 2rem;
      letter-spacing: 0.02em;
    }

    header p {
      margin: 0;
      color: var(--muted);
      max-width: 36em;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .card {
      display: flex;
      flex-direction: column;
      padding: 24px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      color: inherit;
      text-decoration: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .card:hover,
    .card:focus-visible {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
      outline: none;
    }

    .tag {
      align-self: flex-start;
      padding: 2px 10px;
      margin-bottom: 14px;
      font-size: 0.85rem;
      color: var(--accent);
      background: var(--accent-soft);
      border-radius: 999px;
    }

    .card h2 {
      margin: 0 0 6px;
      font-size: 1.35rem;
    }

    .card p {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .go {
      margin-top: auto;
      font-weight: 600;
      color: var(--accent);
    }

    footer {
      margin-top: 48px;
      color: var(--muted);
      font-size: 0.85rem;
    }

    /* 窄螢幕：改成上下排列 */
    @media (max-width: 800px) {
      .cards { grid-template-columns: 1fr; }
      .wrap { padding-top: 36px; }
      h1 { font-size: 1.6rem; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <h1>英打遊戲開發歷程</h1>
      <p>這是我的英打遊戲從第一版到現在的製作紀錄。點選下方卡片，可以開啟每個版本的網站。</p>
    </header>

    <section class="cards" aria-label="版本列表">
      <a class="card" href="https://ritaqiu722-lab.github.io/typing-v1/">
        <span class="tag">已完成</span>
        <h2>版本一</h2>
        <p>最初的版本：標題畫面與開始按鈕。</p>
        <span class="go">前往版本一</span>
      </a>

      <a class="card" href="https://ritaqiu722-lab.github.io/typing-v2/">
        <span class="tag">已完成</span>
        <h2>版本二</h2>
        <p>在第一版的基礎上繼續改進。</p>
        <span class="go">前往版本二</span>
      </a>

      <a class="card" href="v3/index.html">
        <span class="tag">已完成</span>
        <h2>版本三</h2>
        <p>A、S、D、F 鍵位練習：按對加分、按錯重來。</p>
        <span class="go">前往版本三</span>
      </a>
    </section>

    <footer>數位科技概論 課程作品</footer>
  </main>
</body>
</html>
